<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your tiny toolbox</title>
  <meta name="description" content="Small lab tools that run in the browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M12 6v20M20 6v20M6 12h20M6 20h20' stroke='%23fff' stroke-opacity='.5' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff'/%3E%3Ccircle cx='24' cy='9' r='1.6' fill='%23fff'/%3E%3Ccircle cx='9' cy='23.5' r='1.7' fill='none' stroke='%23fff' stroke-width='1.3'/%3E%3C/svg%3E">
  <script>
    // Set before first paint so there's no flash of the wrong theme.
    try {
      var t = localStorage.getItem("clamk-tools:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    /* Layout: a lab whiteboard — thin aluminum rail at the top, tight hero,
       small dense marker-coloured tiles instead of a conventional card grid. */
    :root {
      --bg: #fbfcfc;
      --rail: #c7cdd2;
      --text: #1b2226;
      --muted: #6b747a;
      --border: #e1e5e8;
      --accent: #1f5fe0;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #15181a;
        --rail: #3a4044;
        --text: #eef1f2;
        --muted: #9aa3a8;
        --border: #2b3134;
        --accent: #6fa0ff;
        --card: #1d2124;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15181a;
      --rail: #3a4044;
      --text: #eef1f2;
      --muted: #9aa3a8;
      --border: #2b3134;
      --accent: #6fa0ff;
      --card: #1d2124;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    [hidden] { display: none !important; }

    .rail { height: 6px; background: linear-gradient(180deg, var(--rail), var(--border)); flex: none; }

    .wrap { width: 100%; max-width: 920px; margin: 0 auto; padding: 0 20px; }
    header.wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; padding-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.01em; font-size: 1.05rem; color: var(--text); }
    .brand:hover { text-decoration: none; }
    .brand .cap { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
    .gh { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.88rem; }
    .gh:hover { color: var(--text); text-decoration: none; }
    .gh svg { width: 16px; height: 16px; fill: currentColor; }
    .theme-toggle {
      position: relative;
      width: 50px;
      height: 27px;
      margin-top: 12px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 14%, var(--card));
      cursor: pointer;
      flex: none;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--accent);
      transition: transform 0.18s ease;
    }
    .theme-toggle .knob svg { width: 12px; height: 12px; }
    .theme-toggle .knob .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .knob { transform: translateX(22px); }
    :root[data-theme="dark"] .theme-toggle .knob .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .knob .moon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .knob { transform: translateX(22px); }
      :root:not([data-theme="light"]) .theme-toggle .knob .sun { display: none; }
      :root:not([data-theme="light"]) .theme-toggle .knob .moon { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .theme-toggle .knob { transition: none; }
    }

    main.wrap { flex: 1; padding-top: 10px; padding-bottom: 44px; }
    h1 {
      margin: 0 0 8px;
      max-width: 26ch;
      font-size: clamp(1.7rem, 3.8vw, 2.3rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
    }
    h1 .mk { position: relative; white-space: nowrap; }
    h1 .mk svg { position: absolute; left: -2%; bottom: -4px; width: 104%; height: 10px; }
    .lead { margin: 0 0 26px; max-width: 42ch; color: var(--muted); font-size: 1rem; }

    .section {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      font: 600 0.7rem/1 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .section::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr));
      gap: 10px;
    }
    .tile {
      position: relative;
      padding: 10px 11px;
      border-radius: 9px;
      background: var(--tbg, var(--card));
      border: 1px solid var(--border);
      min-height: 108px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.12s ease;
    }
    .tile:hover { border-color: var(--ink, var(--accent)); }
    .tile:has(h3 a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tile .idx { font: 600 0.62rem "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .04em; color: var(--muted); }
    .tile .cap-dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink, var(--accent)); }
    .tile .sym { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; color: var(--ink, var(--accent)); margin: 3px 0 2px; line-height: 1; }
    .tile h3 { margin: 0 0 2px; font-size: 0.82rem; font-weight: 600; }
    .tile h3 a { color: inherit; outline: none; }
    .tile h3 a:hover { text-decoration: none; }
    /* The title link covers the whole tile. */
    .tile h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
    .tile p { margin: 0; font-size: 0.74rem; line-height: 1.35; color: var(--muted); flex: 1; }
    .tile .tag { position: relative; z-index: 1; align-self: flex-start; margin-top: 6px; font: 600 0.6rem "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .04em; color: var(--muted); opacity: .8; }
    .tile .tag:hover { color: var(--ink, var(--accent)); opacity: 1; }

    .tile.blue { --tbg: #eaf1fe; --ink: #1f5fe0; }
    .tile.green { --tbg: #e9f7ef; --ink: #1f9d5e; }
    .tile.coral { --tbg: #fdeee7; --ink: #d9521f; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .tile.blue { --tbg: #16233d; --ink: #7fa8ff; }
      :root:not([data-theme="light"]) .tile.green { --tbg: #113625; --ink: #5cd99a; }
      :root:not([data-theme="light"]) .tile.coral { --tbg: #3a2015; --ink: #ff9a66; }
    }
    :root[data-theme="dark"] .tile.blue { --tbg: #16233d; --ink: #7fa8ff; }
    :root[data-theme="dark"] .tile.green { --tbg: #113625; --ink: #5cd99a; }
    :root[data-theme="dark"] .tile.coral { --tbg: #3a2015; --ink: #ff9a66; }

    .tray { display: flex; align-items: center; gap: 7px; margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); }
    .tray .pen { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .tray span.lbl { font-size: 0.72rem; color: var(--muted); margin-left: 4px; }

    .skeleton { pointer-events: none; }
    .skeleton i { display: block; border-radius: 5px; background: var(--border); animation: pulse 1.2s ease-in-out infinite alternate; }
    .skeleton i:nth-child(1) { width: 22px; height: 10px; margin-bottom: 8px; }
    .skeleton i:nth-child(2) { width: 36px; height: 20px; margin-bottom: 8px; }
    .skeleton i:nth-child(3) { width: 70%; height: 10px; }
    @keyframes pulse { from { opacity: 0.45; } to { opacity: 1; } }

    .status { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .status:empty { display: none; }
    footer.wrap { padding-top: 18px; padding-bottom: 28px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; }

    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      .skeleton i { animation: none; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); }
    }
  </style>
</head>
<body>
  <div class="rail"></div>

  <header class="wrap">
    <a class="brand" href="./"><span class="cap"></span>Your tiny toolbox</a>
    <a class="gh" href="https://github.com/clamk-tools">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      GitHub
    </a>
  </header>

  <main class="wrap">
    <h1>Small lab tools that run <span class="mk">anywhere<svg viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 Q50 2 100 6 T198 5" stroke="#1f5fe0" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></span>.</h1>
    <p class="lead">No installation, click and go.</p>

    <h2 class="section">Tools</h2>
    <div id="tools" class="grid" aria-busy="true"></div>
    <p id="status" class="status" role="status"></p>
    <noscript><p>This page needs JavaScript to list the tools. Browse them on <a href="https://github.com/clamk-tools">GitHub</a>.</p></noscript>

    <div class="tray" aria-hidden="true">
      <span class="pen" style="background:#1f5fe0"></span>
      <span class="pen" style="background:#1f9d5e"></span>
      <span class="pen" style="background:#d9521f"></span>
      <span class="lbl">pick a colour, pick a tool</span>
    </div>

    <button type="button" id="themeToggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme">
      <span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </span>
    </button>
  </main>

  <footer class="wrap">Free and open source. Code on <a href="https://github.com/clamk-tools">GitHub</a>.</footer>

  <script>
    // Rename the org here if it ever changes.
    const ORG = "clamk-tools";
    // A repo shows up on the hub when it has this topic.
    const TOPIC = "tool";
    // Last good tool list, so repeat visits paint instantly and survive API rate limits.
    const CACHE_KEY = `${ORG}:tools`;
    // Marker colours cycle across tiles in this order.
    const COLORS = ["blue", "green", "coral"];

    const grid = document.getElementById("tools");
    const status = document.getElementById("status");

    // Theme toggle: defaults to the system setting until the visitor picks one explicitly.
    const THEME_KEY = "clamk-tools:theme";
    const themeToggle = document.getElementById("themeToggle");
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

    function isDark() {
      return document.documentElement.getAttribute("data-theme") === "dark"
        || (!document.documentElement.getAttribute("data-theme") && systemDark.matches);
    }

    function updateToggleState() {
      themeToggle.setAttribute("aria-checked", String(isDark()));
    }

    themeToggle.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
      updateToggleState();
    });

    updateToggleState();

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function link(href, text, className) {
      const a = el("a", className, text);
      a.href = href;
      return a;
    }

    // "CellCounter" / "cell-counter" -> "Cell Counter" / "cell counter"
    function displayName(name) {
      return name.replace(/[-_]+/g, " ").replace(/([a-z0-9])([A-Z])/g, "$1 $2");
    }

    function initials(title) {
      const words = title.split(" ").filter(Boolean);
      const letters = words.length > 1 ? words[0][0] + words[1][0] : title.slice(0, 2);
      return letters.toUpperCase();
    }

    function tile(repo, index) {
      const title = displayName(repo.name);
      const site = repo.homepage || (repo.has_pages ? `https://${ORG}.github.io/${repo.name}/` : "");
      const color = COLORS[index % COLORS.length];

      const article = el("article", `tile ${color}`);
      article.append(
        el("span", "idx", String(index + 1).padStart(2, "0")),
        el("span", "cap-dot"),
        el("div", "sym", initials(title)),
      );
      article.lastElementChild.previousElementSibling.setAttribute("aria-hidden", "true");

      const heading = el("h3");
      heading.append(link(site || repo.html_url, title));
      article.append(heading, el("p", "", repo.description || ""));

      if (site) article.append(link(repo.html_url, "Source", "tag"));
      else if (repo.language) article.append(el("span", "tag", repo.language));

      return article;
    }

    function skeleton() {
      const article = el("article", "tile skeleton");
      article.setAttribute("aria-hidden", "true");
      article.append(el("i"), el("i"), el("i"));
      return article;
    }

    function render(tools) {
      grid.replaceChildren(...tools.map((repo, i) => tile(repo, i)));
      grid.removeAttribute("aria-busy");
      status.textContent = tools.length ? "" : "No tools yet.";
    }

    function readCache() {
      try {
        const tools = JSON.parse(localStorage.getItem(CACHE_KEY));
        return Array.isArray(tools) ? tools : null;
      } catch {
        return null;
      }
    }

    function writeCache(tools) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(tools));
      } catch {
        // Storage blocked or full: the page still works, just without the cache.
      }
    }

    const cached = readCache();
    if (cached) render(cached);
    else grid.append(skeleton(), skeleton(), skeleton());

    fetch(`https://api.github.com/orgs/${ORG}/repos?per_page=100`)
      .then((res) => {
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        return res.json();
      })
      .then((repos) => {
        const tools = repos
          .filter((r) => !r.archived && (r.topics || []).includes(TOPIC))
          .sort((a, b) => a.name.localeCompare(b.name))
          .map(({ name, description, homepage, has_pages, html_url, language }) =>
            ({ name, description, homepage, has_pages, html_url, language }));
        render(tools);
        writeCache(tools);
      })
      .catch(() => {
        if (cached) return;
        grid.replaceChildren();
        grid.removeAttribute("aria-busy");
        status.replaceChildren("Couldn't load the tool list. Browse them on ", link(`https://github.com/${ORG}`, "GitHub"), ".");
      });
  </script>
</body>
</html>
